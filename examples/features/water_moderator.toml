# A 2 MeV source at the centre of a 15 cm sphere of light water: neutrons slow
# down on hydrogen and leak out over the whole range from MeV to thermal.
#
# Shows: a compound material by atom fractions (H2O), and a leakage spectrum
# spanning nine decades. Thermal scattering is free-gas (no S(alpha,beta)).

[run]
mode      = "fixed-source"
particles = 5_000
seed      = 26

[materials.water]
density  = 1.0
nuclides = { H1 = 2, O16 = 1 }

[surfaces]
tank = { type = "sphere", center = [0, 0, 0], radius = 15 }

[cells]
water = { region = "-tank", material = "water" }

[source]
space     = { type = "point", xyz = [0, 0, 0] }
direction = "isotropic"
energy    = "2 MeV"

[tallies.leakage]
type        = "leakage"
energy_bins = { log = ["0.001 eV", "2.1 MeV", 90] }

[tallies.absorbed]
type = "absorption"
