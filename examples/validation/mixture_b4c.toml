# B4C-like sphere made with pure B10: a strong absorber mixed with a
# moderator, R = 5 cm, 1 MeV point source. Exercises per-collision isotope
# selection. Same model and number densities as
# Validation/OpenMC_Comparison/validate_mixture.py (4 B : 1 C at 2.52 g/cm3).

[run]
mode      = "fixed-source"
particles = 40_000
batches   = 20
seed      = 12345

[materials.b4c.atom_densities]     # atoms/b-cm
B10 = 0.10992
C12 = 0.02748

[surfaces]
shell = { type = "sphere", center = [0, 0, 0], radius = 5.0 }

[cells]
absorber = { region = "-shell", material = "b4c" }

[source]
space     = { type = "point", xyz = [0, 0, 0] }
direction = "isotropic"
energy    = "1 MeV"

[tallies.leakage]
type        = "leakage"
energy_bins = { lin = [0.0, 1.01e6, 500] }

[tallies.absorbed]
type = "absorption"
