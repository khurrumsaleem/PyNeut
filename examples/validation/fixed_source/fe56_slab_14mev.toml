# Validation case fe56_slab_14mev: Fe56 slab, 4 cm thick (x from -2 to 2), 100 x 100 cm face.
# Point source of 14 MeV neutrons at the centre (fast, (n,xn) in a 4 cm slab).
# Mirrors Validation/OpenMC_Comparison (see docs/index.md for the OpenMC
# comparison). The reference table was produced with the scalar engine:
#   pyneut run fe56_slab_14mev.toml --engine scalar
# The spectrum bins match the suite's energy_grid(): 500 linear bins to
# max(1.01 E, 1 eV).

[run]
mode      = "fixed-source"
particles = 10_000
batches   = 20
seed      = 12345

[materials.target]
density  = 7.87                  # g/cm3
nuclides = { Fe56 = 1.0 }

[surfaces]
slab = { type = "box", min = [-2.0, -50.0, -50.0], max = [2.0, 50.0, 50.0] }

[cells]
target = { region = "-slab", material = "target" }

[source]
space     = { type = "point", xyz = [0, 0, 0] }
direction = "isotropic"
energy    = "14 MeV"

[tallies.leakage]
type        = "leakage"
energy_bins = { lin = [0.0, 1.414e+07, 500] }
