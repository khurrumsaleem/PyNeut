# Validation case c12_cyl_2mev: C12 cylinder, R = 10 cm, height 20 cm.
# Point source of 2 MeV neutrons at the centre (fast, cylinder).
# Mirrors Validation/OpenMC_Comparison (see docs/index.md for the OpenMC
# comparison). The reference table was produced with the scalar engine:
#   pyneut run c12_cyl_2mev.toml --engine scalar
# The spectrum bins match the suite's energy_grid(): 500 linear bins to
# max(1.01 E, 1 eV).

[run]
mode      = "fixed-source"
particles = 10_000
batches   = 20
seed      = 12345

[materials.target]
density  = 2.267                  # g/cm3
nuclides = { C12 = 1.0 }

[surfaces]
side   = { type = "cylinder", axis = "z", center = [0, 0, 0], radius = 10.0 }
top    = { type = "z-plane", at = 10.0 }
bottom = { type = "z-plane", at = -10.0 }

[cells]
target = { region = "-side & -top & +bottom", material = "target" }

[source]
space     = { type = "point", xyz = [0, 0, 0] }
direction = "isotropic"
energy    = "2 MeV"

[tallies.leakage]
type        = "leakage"
energy_bins = { lin = [0.0, 2.02e+06, 500] }
