# Validation case be9_n2n_14mev: Be9 sphere, R = 10 cm.
# Point source of 14 MeV neutrons at the centre (fast, (n,2n) multiplication).
# Mirrors Validation/OpenMC_Comparison (see docs/index.md for the OpenMC
# comparison). The reference table was produced with the scalar engine:
#   pyneut run be9_n2n_14mev.toml --engine scalar
# The spectrum bins match the suite's energy_grid(): 500 linear bins to
# max(1.01 E, 1 eV).

[run]
mode      = "fixed-source"
particles = 10_000
batches   = 20
seed      = 12345

[materials.target]
density  = 1.848                  # g/cm3
nuclides = { Be9 = 1.0 }

[surfaces]
shell = { type = "sphere", center = [0, 0, 0], radius = 10.0 }

[cells]
target = { region = "-shell", material = "target" }

[source]
space     = { type = "point", xyz = [0, 0, 0] }
direction = "isotropic"
energy    = "14 MeV"

[tallies.leakage]
type        = "leakage"
energy_bins = { lin = [0.0, 1.414e+07, 500] }
