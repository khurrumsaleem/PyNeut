# Validation case al27_slab_14mev: Al27 slab, 10 cm thick (x from -5 to 5), 100 x 100 cm face.
# Point source of 14 MeV neutrons at the centre (MT 5, 22, 28 and the charged-particle channels are a fifth of the total).
# Mirrors Validation/OpenMC_Comparison (see docs/index.md for the OpenMC
# comparison). The reference table was produced with the scalar engine:
#   pyneut run al27_slab_14mev.toml --engine scalar
# The spectrum bins match the suite's energy_grid(): 500 linear bins to
# max(1.01 E, 1 eV).

[run]
mode      = "fixed-source"
particles = 10_000
batches   = 20
seed      = 12345

[materials.target]
density  = 2.70                    # g/cm3
nuclides = { Al27 = 1.0 }

[surfaces]
slab = { type = "box", min = [-5.0, -50.0, -50.0], max = [5.0, 50.0, 50.0] }

[cells]
target = { region = "-slab", material = "target" }

[source]
space     = { type = "point", xyz = [0, 0, 0] }
direction = "isotropic"
energy    = "14 MeV"

[tallies.leakage]
type        = "leakage"
energy_bins = { lin = [0.0, 1.414e+07, 500] }
