# Validation case o16_sphere_14mev: O16 sphere, R = 15 cm, at liquid-oxygen density.
# Point source of 14 MeV neutrons at the centre (MT 22, 28 and the (n,a)/(n,p) partials).
# Mirrors Validation/OpenMC_Comparison (see docs/index.md for the OpenMC
# comparison). The reference table was produced with the scalar engine:
#   pyneut run o16_sphere_14mev.toml --engine scalar
# The spectrum bins match the suite's energy_grid(): 500 linear bins to
# max(1.01 E, 1 eV).

[run]
mode      = "fixed-source"
particles = 10_000
batches   = 20
seed      = 12345

[materials.target]
density  = 1.14                    # g/cm3
nuclides = { O16 = 1.0 }

[surfaces]
shell = { type = "sphere", center = [0, 0, 0], radius = 15.0 }

[cells]
target = { region = "-shell", material = "target" }

[source]
space     = { type = "point", xyz = [0, 0, 0] }
direction = "isotropic"
energy    = "14 MeV"

[tallies.leakage]
type        = "leakage"
energy_bins = { lin = [0.0, 1.414e+07, 500] }
