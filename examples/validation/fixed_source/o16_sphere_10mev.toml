# Validation case o16_sphere_10mev: O16 sphere, R = 20 cm.
# Point source of 10 MeV neutrons at the centre (fast, low-density gas).
# Mirrors Validation/OpenMC_Comparison (see docs/index.md for the OpenMC
# comparison). The reference table was produced with the scalar engine:
#   pyneut run o16_sphere_10mev.toml --engine scalar
# The spectrum bins match the suite's energy_grid(): 500 linear bins to
# max(1.01 E, 1 eV).

[run]
mode      = "fixed-source"
particles = 10_000
batches   = 20
seed      = 12345

[materials.target]
density  = 0.0014                  # g/cm3
nuclides = { O16 = 1.0 }

[surfaces]
shell = { type = "sphere", center = [0, 0, 0], radius = 20.0 }

[cells]
target = { region = "-shell", material = "target" }

[source]
space     = { type = "point", xyz = [0, 0, 0] }
direction = "isotropic"
energy    = "10 MeV"

[tallies.leakage]
type        = "leakage"
energy_bins = { lin = [0.0, 1.01e+07, 500] }
