# Validation case c12_thermal: C12 sphere, R = 5 cm.
# Point source of 0.0253 eV neutrons at the centre (thermal, free-gas upscatter).
# Mirrors Validation/OpenMC_Comparison (see docs/index.md for the OpenMC
# comparison). The reference table was produced with the scalar engine:
#   pyneut run c12_thermal.toml --engine scalar
# The spectrum bins match the suite's energy_grid(): 500 linear bins to
# max(1.01 E, 1 eV).

[run]
mode      = "fixed-source"
particles = 10_000
batches   = 20
seed      = 12345

[materials.target]
density  = 1.7                  # g/cm3
nuclides = { C12 = 1.0 }

[surfaces]
shell = { type = "sphere", center = [0, 0, 0], radius = 5.0 }

[cells]
target = { region = "-shell", material = "target" }

[source]
space     = { type = "point", xyz = [0, 0, 0] }
direction = "isotropic"
energy    = "0.0253 eV"

[tallies.leakage]
type        = "leakage"
energy_bins = { lin = [0.0, 1, 500] }
