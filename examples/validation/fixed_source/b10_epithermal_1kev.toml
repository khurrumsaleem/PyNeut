# Validation case b10_epithermal_1kev: B10 sphere, R = 1 cm.
# Point source of 1 keV neutrons at the centre (epithermal, strong 1/v absorber).
# Mirrors Validation/OpenMC_Comparison (see docs/index.md for the OpenMC
# comparison). The reference table was produced with the scalar engine:
#   pyneut run b10_epithermal_1kev.toml --engine scalar
# The spectrum bins match the suite's energy_grid(): 500 linear bins to
# max(1.01 E, 1 eV).

[run]
mode      = "fixed-source"
particles = 10_000
batches   = 20
seed      = 12345

[materials.target]
density  = 2.34                  # g/cm3
nuclides = { B10 = 1.0 }

[surfaces]
shell = { type = "sphere", center = [0, 0, 0], radius = 1.0 }

[cells]
target = { region = "-shell", material = "target" }

[source]
space     = { type = "point", xyz = [0, 0, 0] }
direction = "isotropic"
energy    = "1 keV"

[tallies.leakage]
type        = "leakage"
energy_bins = { lin = [0.0, 1010, 500] }
